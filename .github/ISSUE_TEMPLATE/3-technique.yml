name: Technique proposal
description: A technique you have used and that reduced token usage.
title: "[Technique] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        A maintainer will turn this into a file in `techniques/`. Please do not include personal data ([privacy rules](https://github.com/rafmosk/cto_claude_token_optimization/blob/main/PRIVACY.md)).
  - type: input
    id: name
    attributes:
      label: Technique name
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Prompting
        - Context
        - Model routing
        - Caching
        - Skills and memory
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it works
      multiple: true
      options:
        - Claude app
        - API
        - Claude Code
    validations:
      required: true
  - type: input
    id: models
    attributes:
      label: Models and effort levels tested
    validations:
      required: true
  - type: textarea
    id: technique
    attributes:
      label: The technique
      description: What to do, step by step, in plain language.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Before/after example
      description: Anonymized. Say if it is made up for illustration.
  - type: textarea
    id: saving
    attributes:
      label: Saving
      description: Label each number as measured, calculated or estimated.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Trade-offs
      description: What gets worse, slower or riskier.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue contains no personal data, credentials or company names
          required: true
