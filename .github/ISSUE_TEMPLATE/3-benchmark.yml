name: Benchmark
description: A before/after measurement of a technique.
title: "[Benchmark] "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Please follow the [measuring method](https://github.com/rafmosk/cto_claude_token_optimization/blob/main/docs/measuring.md) and do not include personal data.
  - type: input
    id: technique
    attributes:
      label: Technique measured
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Where, model and effort
      placeholder: "API, <model>, <effort>"
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task
      description: Described generically.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results
      description: Input and output tokens before and after, number of runs, how tokens were counted.
    validations:
      required: true
  - type: textarea
    id: quality
    attributes:
      label: Quality check
      description: Did the answers stay as good?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue contains no personal data, credentials or company names
          required: true
