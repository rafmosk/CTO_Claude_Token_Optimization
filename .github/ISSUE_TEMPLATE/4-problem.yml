name: Problem with content
description: A technique that does not work as described, a wrong number, a broken link.
title: "[Problem] "
labels: ["bug"]
body:
  - type: input
    id: file
    attributes:
      label: File or section
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: What you tried and what happened.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue contains no personal data, credentials or company names
          required: true
