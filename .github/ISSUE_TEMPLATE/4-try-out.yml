name: Try-out result
description: You tried a rule or technique and want to tell how it went. Numbers optional.
title: "[Try-out] "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        A clear description of what happened is enough. If you measured something, add the numbers: the [measuring method](https://github.com/rafmosk/cto_claude_token_optimization/blob/main/docs/measuring.md) explains how.
        Never paste your prompts, files or conversations, and do not include personal data.
  - type: input
    id: technique
    attributes:
      label: Rule or technique tried
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Where, model and effort
      placeholder: "Claude app, <model>, <effort>"
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Kind of task
      description: Described generically, for example "extracting dates from 15 invoices".
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: How it went
      description: Did it help? Did quality stay the same? Anything unexpected?
    validations:
      required: true
  - type: textarea
    id: numbers
    attributes:
      label: Numbers (optional)
      description: Tokens before and after, number of runs, how you counted them. Label each as measured, calculated or estimated.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue contains no personal data, credentials or company names
          required: true
