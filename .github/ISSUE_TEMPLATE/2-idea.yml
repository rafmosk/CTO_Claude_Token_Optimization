name: Idea
description: A possible way to save tokens. Not tested yet is fine.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing. Please do not include personal data, credentials or company names ([privacy rules](https://github.com/rafmosk/cto_claude_token_optimization/blob/main/PRIVACY.md)).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Where are tokens being wasted?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What could reduce them?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Prompting
        - Context
        - Model routing
        - Caching
        - Skills and memory
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue contains no personal data, credentials or company names
          required: true
